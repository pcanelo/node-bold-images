stages:
  - build
  - test
  - push

variables:
  DOCKER_DRIVER: overlay2
  REGISTRY_IMAGE: $CI_REGISTRY_IMAGE

.build_template: &build_template
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker build -t $REGISTRY_IMAGE/$NODE_VERSION-$IMAGE_TYPE:$CI_COMMIT_SHORT_SHA -f $NODE_VERSION/$IMAGE_TYPE/Dockerfile .
    - docker save $REGISTRY_IMAGE/$NODE_VERSION-$IMAGE_TYPE:$CI_COMMIT_SHORT_SHA > $NODE_VERSION-$IMAGE_TYPE.tar
  artifacts:
    paths:
      - $NODE_VERSION-$IMAGE_TYPE.tar
    expire_in: 1 hour

.test_template: &test_template
  stage: test
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker load < $NODE_VERSION-$IMAGE_TYPE.tar
    - docker run --rm -e IMAGE_TYPE=$IMAGE_TYPE -v "$CI_PROJECT_DIR/common/scripts/smoke-test.sh:/tmp/smoke-test.sh:ro" $REGISTRY_IMAGE/$NODE_VERSION-$IMAGE_TYPE:$CI_COMMIT_SHORT_SHA sh /tmp/smoke-test.sh
.push_template: &push_template
  stage: push
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker load < $NODE_VERSION-$IMAGE_TYPE.tar
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $REGISTRY_IMAGE/$NODE_VERSION-$IMAGE_TYPE:$CI_COMMIT_SHORT_SHA
    - docker tag $REGISTRY_IMAGE/$NODE_VERSION-$IMAGE_TYPE:$CI_COMMIT_SHORT_SHA $REGISTRY_IMAGE/$NODE_VERSION-$IMAGE_TYPE:latest
    - docker push $REGISTRY_IMAGE/$NODE_VERSION-$IMAGE_TYPE:latest
  only:
    - main

# Node 14
build:node14:dev:
  <<: *build_template
  variables:
    NODE_VERSION: "node14"
    IMAGE_TYPE: "dev"

test:node14:dev:
  <<: *test_template
  variables:
    NODE_VERSION: "node14"
    IMAGE_TYPE: "dev"
  needs:
    - job: build:node14:dev
      artifacts: true

push:node14:dev:
  <<: *push_template
  variables:
    NODE_VERSION: "node14"
    IMAGE_TYPE: "dev"
  needs:
    - job: build:node14:dev
      artifacts: true
    - job: test:node14:dev

build:node14:runtime:
  <<: *build_template
  variables:
    NODE_VERSION: "node14"
    IMAGE_TYPE: "runtime"

test:node14:runtime:
  <<: *test_template
  variables:
    NODE_VERSION: "node14"
    IMAGE_TYPE: "runtime"
  needs:
    - job: build:node14:runtime
      artifacts: true

push:node14:runtime:
  <<: *push_template
  variables:
    NODE_VERSION: "node14"
    IMAGE_TYPE: "runtime"
  needs:
    - job: build:node14:runtime
      artifacts: true
    - job: test:node14:runtime

